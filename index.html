<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GrashaPhama - Kenya's Online Pharmacy & Express Medicine Delivery</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0284c7">
  <link rel="manifest" href="manifest.json">
  
  <!-- App Stylesheet (Glossy Blue & White) -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Desktop Presentation Toolbar -->
  <div class="desktop-bar">
    <div class="desktop-bar-title">
      <span style="font-size: 17px;">💊</span>
      <span>GrashaPhama</span>
      <span style="font-size: 10px; background: rgba(59, 130, 246, 0.4); padding: 2px 7px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2);">PPB KENYA</span>
      <span id="desktopUserPill" style="font-size: 11px; background: rgba(16, 185, 129, 0.25); color: #34d399; padding: 2px 8px; border-radius: 12px; font-weight: 700; border: 1px solid rgba(52, 211, 153, 0.3);">
        👩 Patient Mode
      </span>
    </div>
    <button class="desktop-btn" style="background: rgba(2, 132, 199, 0.35); border-color: rgba(56, 189, 248, 0.4);" onclick="app.toggleRole()">
      <span>⚡ Switch Role (Admin / Patient)</span>
    </button>
    <button class="desktop-btn" onclick="app.navigateTo('admin')" title="Grasha Admin Portal">
      <span>🛡️ Admin Portal (Sales & Stock)</span>
    </button>
    <button class="desktop-btn" onclick="app.toggleFluidMode()">
      <span>🔄 View (Phone / Tablet)</span>
    </button>
    <button class="desktop-btn" onclick="app.navigateTo('whatsapp')">
      <span style="color:#25d366;">💬</span>
      <span>WhatsApp Bot</span>
    </button>
    <button class="desktop-btn" onclick="app.openAuthModal()">
      <span>🔑 Login / Account</span>
    </button>
  </div>

  <!-- Mobile Smartphone Chassis (iPhone 16 Pro styling) -->
  <div class="device-wrapper" id="deviceWrapper">
    
    <!-- iOS / Android Status Bar with Dynamic Island -->
    <div class="status-bar">
      <span id="statusClock">20:30</span>
      <div class="dynamic-island" onclick="app.navigateTo('tracking')" title="Track Grasha Delivery">
        <div class="dynamic-island-camera"></div>
        <div style="font-size: 9.5px; color: #fff; font-weight: 800; display:flex; align-items:center; gap:4px;">
          <span>🛵 25m NBO</span>
        </div>
        <div class="dynamic-island-sensor"></div>
      </div>
      <div class="status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>100% 🔋</span>
      </div>
    </div>

    <!-- App Header -->
    <header class="app-header">
      <div class="header-brand-block" onclick="app.navigateTo('profile')" style="cursor:pointer;">
        <div class="brand-row">
          <span class="brand-badge">GrashaPhama</span>
          <span style="font-size: 10.5px; font-weight: 800; color: #00a859;">🇰🇪 PPB</span>
        </div>
        <div class="header-location-line">
          <span>📍 Deliver: <strong>Westlands, Nairobi</strong></span>
          <span style="font-size: 8px;">▼</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="headerAdminShortcut" onclick="app.navigateTo('admin')" title="Admin Dashboard (Sales & Inventory)" style="display:none; color:#f59e0b; border-color:rgba(245, 158, 11, 0.3);">
          <span style="font-size: 16px;">🛡️</span>
        </button>
        <button class="icon-button" onclick="app.openAuthModal()" title="Account & Login" id="headerUserBtn">
          <span id="headerUserAvatar" style="font-size: 15px;">👩</span>
        </button>
        <button class="icon-button" onclick="app.navigateTo('whatsapp')" title="WhatsApp Care Bot">
          <span style="font-size: 17px; color:#25d366;">💬</span>
        </button>
        <button class="icon-button" onclick="app.navigateTo('cart')" title="View Cart">
          <span id="headerCartIcon">🛒</span>
          <span class="badge-counter" id="headerCartBadge" style="display:none;">0</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Screen Content Container -->
    <main class="app-content" id="appContent">
      <!-- Dynamically rendered by app.js -->
    </main>

    <!-- Native Bottom Navigation Bar (Store, Prescriptions, Cart, Track, WhatsApp, Profile) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home" onclick="app.navigateTo('home')">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="nav-label">Store</span>
      </button>

      <button class="nav-item" data-view="rx" onclick="app.navigateTo('rx')">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <span class="nav-label">Prescriptions</span>
      </button>

      <button class="nav-item" data-view="cart" onclick="app.navigateTo('cart')">
        <div class="nav-icon" style="position:relative;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="nav-badge" id="navCartBadge" style="display:none;">0</span>
        </div>
        <span class="nav-label">Cart</span>
      </button>

      <button class="nav-item" data-view="tracking" onclick="app.navigateTo('tracking')">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </div>
        <span class="nav-label">Track</span>
      </button>

      <button class="nav-item" data-view="whatsapp" onclick="app.navigateTo('whatsapp')">
        <div class="nav-icon" style="color:#25d366;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </div>
        <span class="nav-label">WhatsApp</span>
      </button>

      <button class="nav-item" data-view="profile" onclick="app.navigateTo('profile')">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </div>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

    <!-- Native Home Gesture Bar -->
    <div class="home-indicator-bar"></div>

    <!-- Bottom Sheet Modal Container -->
    <div class="sheet-overlay" id="bottomSheetOverlay" onclick="if(event.target === this) app.closeBottomSheet()">
      <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-drag-handle"></div>
        <div id="sheetBody">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW note:', err);
        });
      });
    }
  </script>
</body>
</html>
